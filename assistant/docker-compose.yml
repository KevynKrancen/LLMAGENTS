# Postgres + pgvector for the Hermes assistant.
# Start: docker compose -f assistant/docker-compose.yml up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hermes-db
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5433:5432"
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hermes_pgdata:
